services:
  db:
    image: postgres:17-alpine
    container_name: laneline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laneline
      POSTGRES_PASSWORD: laneline
      POSTGRES_DB: laneline
    ports:
      # 5433 on the host so it doesn't collide with a locally installed Postgres
      - "5433:5432"
    volumes:
      - laneline-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laneline -d laneline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  laneline-db:
